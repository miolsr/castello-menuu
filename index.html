<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">مطعم كاستيللو - قائمة الطعام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

    <header class="main-header">
        <div class="nav-bar">
            <h1 id="restaurant-name">مطعم كاستيللو</h1>
            <div class="nav-actions">
                <div class="lang-selector-wrapper" style="position: relative; display: inline-block;">
                    <select id="lang-change-select" class="nav-btn" style="appearance: none; -webkit-appearance: none; padding-left: 28px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 0.85rem; font-weight: 600;">
                        <option value="ar">العربية</option>
                        <option value="tr">Türkçe</option>
                        <option value="en">English</option>
                    </select>
                    <i class="fas fa-globe" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 0.85rem; color: var(--text-luxury);"></i>
                </div>

                <button id="theme-toggle-btn" class="nav-btn"><i class="fas fa-moon"></i></button>
                <button id="cart-toggle-btn" class="nav-btn" onclick="toggleCartSidebar()">
                    <i class="fas fa-shopping-bag"></i> <span id="cart-count">0</span>
                </button>
                <a href="admin.html" class="nav-btn" title="لوحة التحكم"><i class="fas fa-user-gear"></i></a>
            </div>
        </div>
        
        <div class="restaurant-banner" id="restaurant-banner">
            <div class="banner-overlay-content">
                <div class="status-tags">
                    <span id="restaurant-status" class="status-tag">جاري التحميل...</span>
                    <span id="working-hours"><i class="far fa-clock"></i> ساعات العمل...</span>
                </div>
                <p id="restaurant-address"><i class="fas fa-map-marker-alt"></i> سوريا - الباب</p>
                <a id="maps-link" href="#" target="_blank" class="maps-btn"><i class="fas fa-location-dot"></i> عرض الموقع</a>
            </div>
        </div>
    </header>

    <nav class="categories-nav">
        <div class="container" id="categories-container"></div>
    </nav>

    <main class="menu-container">
        <div class="container">
            
            <div class="section-header-row" style="display: flex !important; justify-content: space-between !important; align-items: center !important; flex-direction: row !important; gap: 20px !important; margin-bottom: 25px !important; width: 100% !important; border-bottom: 1px solid var(--border-luxury, #242424); padding-bottom: 15px;">
                
                <h2 class="section-title" id="current-category-title" style="margin: 0 !important; padding: 0 10px 0 0 !important; border-right: 4px solid var(--gold-premium); font-size: 1.3rem; font-weight: 700; white-space: nowrap !important; display: inline-block !important;">كل الأطباق</h2>
                
                <div class="search-wrapper" style="position: relative !important; width: 100% !important; max-width: 320px !important; margin: 0 !important; display: block !important;">
                    <input type="text" id="search-input" placeholder="ابحث عن وجبة..." style="width: 100% !important; padding: 10px 40px 10px 15px !important; background-color: var(--bg-card-luxury, #141414) !important; border: 1px solid var(--border-luxury, #242424) !important; border-radius: 25px !important; color: var(--text-pure, #fff) !important; font-family: 'Cairo', sans-serif !important; font-size: 0.9rem !important; outline: none !important; transition: all 0.3s ease !important;">
                    <i class="fas fa-search" style="position: absolute !important; right: 15px !important; top: 50% !important; transform: translateY(-50%) !important; color: var(--gold-premium, #f59e0b) !important; font-size: 1rem !important; pointer-events: none !important;"></i>
                </div>

            </div>

            <div class="meals-grid" id="meals-container"></div>
        </div>
    </main>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-shopping-bag"></i> سلة الطلبات</h3>
            <button class="close-sidebar-btn" onclick="toggleCartSidebar()">×</button>
        </div>
        <div class="sidebar-body">
            <div id="cart-items-list"></div>
            
            <div class="cart-total-section">
                <p>الإجمالي: <span id="cart-total-price">0</span>TL</p>
            </div>

            <div class="customer-delivery-form">
                <h4>بيانات التوصيل</h4>
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="cust-name" placeholder="أدخل اسمك الثنائي">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="cust-phone" placeholder="09xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل (الحي / الشارع / علامة مميزة):</label>
                    <textarea id="cust-address" rows="3" placeholder="مثال: الباب - بجانب جامع الكبير - بناء المتوكل ط2"></textarea>
                </div>
                <button class="submit-order-btn" onclick="sendOrderViaWhatsApp()">تأكيد وإرسال عبر واتساب <i class="fab fa-whatsapp"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
